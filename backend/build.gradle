plugins {
    id 'java'
}

group = 'com.forsetijudge'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation 'at.favre.lib:bcrypt:0.10.2'

    implementation 'org.springframework.boot:spring-boot-devtools:4.2.0-M2'
    implementation 'org.springframework.boot:spring-boot-starter:4.2.0-M2'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa:4.2.0-M2'
    implementation 'org.springframework.boot:spring-boot-starter-security:4.2.0-M2'
    implementation 'org.springframework.boot:spring-boot-starter-test:4.2.0-M2'
    implementation 'org.springframework.boot:spring-boot-starter-validation:4.2.0-M2'
    implementation 'org.springframework.boot:spring-boot-starter-web:4.2.0-M2'

    implementation 'org.xerial:sqlite-jdbc:3.53.4.0'
}

test {
    useJUnitPlatform()
}