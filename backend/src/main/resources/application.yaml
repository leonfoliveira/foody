spring:
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: ${DB_URL:jdbc:sqlite:foody.db}
    username: ${DB_USER:foody}
    password: ${DB_PASSWORD:foody}
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
jwt:
  secret: ${JWT_SECRET:secret}
  expirationMs: ${JWT_EXPIRATION_MS:3600000}
cors:
  allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}