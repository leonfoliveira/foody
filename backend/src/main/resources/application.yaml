spring:
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: ${DB_URL:jdbc:sqlite:memory:foody}
    username: ${DB_USER:foody}
    password: ${DB_PASSWORD:foody}
  jpa:
    properties:
      hibernate:
        ddl-auto: create-drop
        dialect: org.hibernate.community.dialect.SQLiteDialect